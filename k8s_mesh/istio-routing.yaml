apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: llm-d-mesh-strict-mtls
  namespace: llm-d-mesh
spec:
  mtls:
    mode: STRICT
---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: grpc-inference-gateway
  namespace: llm-d-mesh
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 15051
      name: grpc
      protocol: HTTP2
    hosts:
    - "*"
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: grpc-inference-sim-dr
  namespace: llm-d-mesh
spec:
  host: grpc-inference-sim.llm-d-mesh.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      http:
        h2UpgradePolicy: UPGRADE
        maxRequestsPerConnection: 100
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: grpc-inference-sim-vs
  namespace: llm-d-mesh
spec:
  hosts:
  - "*"
  gateways:
  - grpc-inference-gateway
  http:
  - route:
    - destination:
        host: grpc-inference-sim.llm-d-mesh.svc.cluster.local
        port:
          number: 50051
